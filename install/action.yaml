name: Trunk Check
author: trunk.io
description: Install trunk and managed tools to PATH

inputs:
  tools:
    description: specific tools to install (if not specified will install all enabled tools)
    required: false

  cli-version:
    description:
      Version of the trunk CLI to download. Defaults to the version that this release of the action
      pins. `cli.version` in `.trunk/trunk.yaml` still selects the version that runs `trunk check`.
    required: false

  cli-channel:
    description: Release channel of the trunk CLI download. Defaults to the pinned channel.
    required: false

  launcher:
    description: Set to 'legacy' to download the legacy trunk launcher instead of the trunk CLI.
    required: false
    default: new

branding:
  icon: check
  color: green

runs:
  using: composite
  steps:
    - name: get trunk
      shell: bash
      run: ${GITHUB_ACTION_PATH}/get_trunk.sh
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_CLI_CHANNEL: ${{ inputs.cli-channel }}
        INPUT_LAUNCHER: ${{ inputs.launcher }}

    - name: clean up possible dead symlink
      shell: bash
      run: |
        tools_path=".trunk/tools"
        if [ -L "${tools_path}" ] && [ ! -e "${tools_path}" ] ; then
          rm "${tools_path}"
        fi

    - name: Trunk install
      shell: bash
      run: trunk tools install --ci ${{ inputs.tools }}

    - name: Add .trunk/tools to path
      shell: bash
      run: echo ".trunk/tools" >> $GITHUB_PATH
